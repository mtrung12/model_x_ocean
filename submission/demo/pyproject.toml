[project]
name = "ocean-demo"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "openai>=1.40",
    "faiss-cpu>=1.8",
    "pandas>=2.0",
    "numpy>=2.0,<3.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "sentence-transformers>=2.6",
    "einops>=0.8.2",
]

[tool.pyright]
extraPaths = ["packages", "apps/backend"]
